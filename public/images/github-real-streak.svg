<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none" role="img" aria-label="GitHub Streak Stats">
  <style>
    .streak-num { font: 800 28px 'Segoe UI', Ubuntu, Sans-Serif; fill: #f8fafc; text-anchor: middle; }
    .streak-label { font: 600 13px 'Segoe UI', Ubuntu, Sans-Serif; fill: #06b6d4; text-anchor: middle; text-transform: uppercase; letter-spacing: 0.5px; }
    .streak-date { font: 500 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #64748b; text-anchor: middle; }
    .fire { fill: #f97316; }
    .ring-bg { stroke: #1e293b; fill: none; stroke-width: 4; }
    .ring-active { stroke: #06b6d4; stroke-width: 4; fill: none; stroke-linecap: round; }
    .divider { stroke: #1e293b; stroke-width: 1; }
  </style>
  <rect x="0.5" y="0.5" rx="10" height="99%" width="99%" fill="#0b1020" stroke="#1e293b" />

  <g transform="translate(85, 60)">
    <text x="0" y="28" class="streak-num" fill="#39d353" style="fill:#39d353;">4,800+</text>
    <text x="0" y="55" class="streak-label">Total Contributions</text>
    <text x="0" y="75" class="streak-date">Nov 30, 2021 – Present</text>
  </g>

  <line x1="170" y1="35" x2="170" y2="160" class="divider" />

  <g transform="translate(247, 85)">
    <circle cx="0" cy="0" r="42" class="ring-bg"/>
    <circle cx="0" cy="0" r="42" class="ring-active" stroke-dasharray="264" stroke-dashoffset="30" transform="rotate(-90)"/>
    <path class="fire" d="M0 -32c-2 4-5 9-3 14 1 3 3 5 2 9-2 4-6 6-6 10 0 7 6 12 13 12 8 0 14-6 14-14 0-9-7-14-10-18-2-3-2-6-1-8 1-3 0-6-1-8-1-2-5-4-8-7z" transform="scale(0.55) translate(-7, -10)"/>
    <text x="0" y="10" class="streak-num">291</text>
    <text x="0" y="32" class="streak-label">Current Streak</text>
    <text x="0" y="52" class="streak-date">Jan 1, 2026 – Today</text>
  </g>

  <line x1="325" y1="35" x2="325" y2="160" class="divider" />

  <g transform="translate(410, 60)">
    <text x="0" y="28" class="streak-num">291</text>
    <text x="0" y="55" class="streak-label">Longest Streak</text>
    <text x="0" y="75" class="streak-date">All 2026 Days Active 🔥</text>
  </g>
</svg>
