    .rank-circle { stroke: #14b8a6; stroke-dasharray: 250; stroke-dashoffset: 45; stroke-width: 4; stroke-linecap: round; fill: none; }
    .rank-text { font: 800 24px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdf8; }
